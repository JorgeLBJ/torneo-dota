# Pruebas locales: construye desde este checkout (context ..) y publica SOLO en 127.0.0.1.
# Usa nombres propios (proyecto, contenedor, volumen) para no mezclarse con producción.
#   docker compose -f deploy/compose.local.yml up -d --build
name: torneo-dota-local

services:
  torneo-dota:
    container_name: torneo-dota-local
    image: torneo-dota:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      DATABASE_PATH: /data/torneos.db
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${LOCAL_PORT:-3097}:3000"
    volumes:
      - torneo-dota-local_data:/data
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  torneo-dota-local_data:
    name: torneo-dota-local_data
